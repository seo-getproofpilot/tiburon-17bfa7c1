<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#04121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tastings">
<title>Tiburón tastings</title>
<link rel="icon" href="https://seo-getproofpilot.github.io/tiburon-17bfa7c1/assets/img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://seo-getproofpilot.github.io/tiburon-17bfa7c1/assets/img/cal-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--abyss:#04121a;--sand:#f3ede2;--bone:#faf6ee;--ink:#14201f;--ink2:#4a5755;--line:rgba(20,32,31,.14);--champ:#e8d3a6;--champ-ink:#76582a;--ok:#1d5e47;--red:#8f2d1d;--red-bg:#f6e1d9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.cap{font-weight:700;font-stretch:125%;letter-spacing:.18em;text-transform:uppercase}
header{position:sticky;top:0;z-index:5;color:var(--bone);background:linear-gradient(180deg,rgba(4,18,26,.74),rgba(4,18,26,.95) 75%),url(https://seo-getproofpilot.github.io/tiburon-17bfa7c1/assets/img/tr-seat.webp) center 38%/cover var(--abyss);padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.hd{display:flex;align-items:center;gap:13px;max-width:720px;margin:0 auto}
.mk{width:26px;height:32px;flex:none;background:var(--champ);-webkit-mask:url(https://seo-getproofpilot.github.io/tiburon-17bfa7c1/assets/img/mark.svg) center/contain no-repeat;mask:url(https://seo-getproofpilot.github.io/tiburon-17bfa7c1/assets/img/mark.svg) center/contain no-repeat}
.hd small{display:block;font-size:10.5px;color:var(--champ);margin-bottom:3px}
.hd h1{margin:0;font-size:21px;line-height:1.05;font-weight:800;font-stretch:118%;text-transform:uppercase}
.hd button{margin-left:auto;background:none;border:0;color:rgba(250,246,238,.7);font:600 13px/1 var(--f);text-decoration:underline;text-underline-offset:3px;padding:10px 0;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:0 14px}
h2{margin:26px 0 10px;font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2 b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;letter-spacing:0;font-stretch:100%}
.new{background:var(--bone);box-shadow:inset 0 0 0 1.5px var(--red),0 14px 24px -22px rgba(4,18,26,.55);padding:15px;margin:0 0 10px;position:relative}
.new .when{font-size:10.5px;color:var(--red);margin:0 0 4px}
.new .t{font-size:22px;font-weight:800;font-stretch:115%;line-height:1.1}
.new .who{font-size:17px;font-weight:700;margin:2px 0 0}
.new .m{color:var(--ink2);font-size:14.5px;margin:2px 0 0}
.rm{display:inline-block;font-size:9.5px;padding:4px 8px;margin-bottom:8px;color:#fff;background:var(--c)}
.acts{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;min-height:50px;border:0;box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;color:var(--ink);font:700 12.5px/1 var(--f);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.go{background:var(--abyss);color:var(--bone);box-shadow:none}
.btn:disabled{opacity:.5}
.list{background:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:2px 12px;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:800;font-stretch:112%;font-size:16px}
.row .who{font-weight:700;min-width:0}
.row .g{color:var(--ink2);font-size:14px;white-space:nowrap}
.row details{grid-column:2/-1;font-size:14px;color:var(--ink2)}
.row summary{cursor:pointer;color:var(--ink2);font-size:13px;text-decoration:underline;text-underline-offset:3px;list-style:none}
.row summary::-webkit-details-marker{display:none}
.row details a{color:var(--ink)}
.row .x{background:none;border:0;padding:6px 0 0;color:var(--red);font:600 13px var(--f);text-decoration:underline;cursor:pointer}
.warn{grid-column:2/-1;color:var(--red);font-size:13px;font-weight:600;margin:4px 0 0}
.row .rmn{grid-column:2/-1;font-size:12.5px;font-weight:700;color:var(--c)}
.day{padding:9px 14px;font-size:10.5px;color:var(--ink2);background:rgba(20,32,31,.04);border-bottom:1px solid var(--line)}
.none{margin:0;padding:16px 14px;color:var(--ink2);font-size:14.5px}
.closed{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14.5px}
.closed:last-child{border-bottom:0}
.closed span{flex:1}
.closed button{background:none;border:0;color:var(--ink);font:700 13px var(--f);text-decoration:underline;cursor:pointer}
.closebox{background:var(--bone);box-shadow:inset 0 0 0 1px var(--line);padding:14px;margin-top:10px}
.closebox label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.closebox input,.closebox select{width:100%;height:48px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff;padding:0 12px;font:400 16px var(--f);color:var(--ink);border-radius:0;margin-bottom:12px;-webkit-appearance:none}
.more{width:100%;margin-top:10px}
.flt{display:flex;gap:6px;overflow-x:auto;margin:14px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;background:var(--bone);box-shadow:inset 0 0 0 1px var(--line);font:600 14px var(--f);color:var(--ink);cursor:pointer;white-space:nowrap}
.flt button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.flt button.on{background:var(--abyss);color:var(--bone);box-shadow:none}
.flt button b{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px}
.sound{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:11px 14px;background:var(--abyss);color:var(--bone);font-size:14px}
.sound[hidden]{display:none}
.sound span{flex:1}
.sound button{background:var(--champ);color:var(--abyss);border:0;font:700 11px/1 var(--f);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;padding:11px 12px;cursor:pointer;white-space:nowrap}
.err{background:var(--red-bg);color:var(--red);padding:12px 14px;margin:14px 0;font-weight:600}
.err[hidden]{display:none}
.upd{margin:18px 0 0;font-size:12.5px;color:var(--ink2);text-align:center}
/* sign in */
.login{max-width:440px;margin:0 auto;padding:30px 16px}
.login h2{margin:0 0 14px}
.pick{display:grid;gap:8px}
.pick button{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 16px;border:0;background:var(--bone);box-shadow:inset 0 0 0 1px var(--line);font:700 17px var(--f);color:var(--ink);text-align:left;cursor:pointer}
.pick button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick .all{min-height:44px;background:none;box-shadow:none;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline}
.pin input{width:100%;height:64px;border:0;box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff;text-align:center;font:800 30px var(--f);letter-spacing:.5em;padding-left:.5em;color:var(--ink);border-radius:0}
.pin p{color:var(--ink2);font-size:14px}
.pin .btn{width:100%;margin-top:12px}
.pin .back{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink2);font:600 14px var(--f);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--champ);color:var(--abyss);padding:11px 18px;font:700 11px/1 var(--f);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;z-index:30;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(4,18,26,.6)}
.toast[hidden]{display:none}
:focus-visible{outline:2px solid var(--champ-ink);outline-offset:2px}
</style>
</head>
<body>
<header><div class="hd"><span class="mk" aria-hidden="true"></span><div><small class="cap">Tiburón tastings</small><h1 id="ttl">Tasting rooms</h1></div><button type="button" id="out" hidden>Sign out</button></div></header>
<div style="background:#e8d3a6;color:#14191b;font:600 13px/1.35 -apple-system,sans-serif;padding:8px 14px;text-align:center">Preview with sample bookings. Any 6-digit PIN works. Nothing is saved or emailed.</div>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>
<script src="mock2.js?v=3"></script>
<script>
(function () {
  var CFG = {"api":"/mock-api/","max":"2027-03-25","rooms":{"san-pedro":{"name":"San Pedro","color":"#c8873d"},"placencia":{"name":"Placencia Village","color":"#2f8f8c"},"caye-caulker":{"name":"Caye Caulker","color":"#3d6f9e"},"san-ignacio":{"name":"San Ignacio","color":"#5d8a4c"}}};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var api = function (path, body) {
    return fetch(CFG.api + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' } : { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  };
  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2400); }
  var store = { get: function () { try { return JSON.parse(localStorage.getItem('tbRoom') || 'null'); } catch (e) { return null; } }, set: function (v) { try { if (v) localStorage.setItem('tbRoom', JSON.stringify(v)); else localStorage.removeItem('tbRoom'); } catch (e) {} } };

  /* old private links (?room=..&key=..) sign the phone in too */
  var qs = new URLSearchParams(location.search);
  if (qs.get('room') && qs.get('key')) { store.set({ room: qs.get('room'), key: qs.get('key') }); history.replaceState(null, '', location.pathname); }

  var me = store.get(), data = null, known = null, today = '', seq = 0, showAll = false, closing = false;
  var view = (function () { try { return localStorage.getItem('tbView') || 'all'; } catch (e) { return 'all'; } })();
  var setView = function (v) { view = v; try { localStorage.setItem('tbView', v); } catch (e) {} known = pendingIds(); setTitle(); draw(); };
  var inView = function (b) { return view === 'all' || b.room === view; };
  var pendingIds = function () { return data ? data.bookings.filter(function (b) { return b.status === 'pending' && inView(b); }).map(function (b) { return b.id; }) : []; };
  var roomName = function (slug) { return slug === 'all' ? 'All rooms' : (CFG.rooms[slug] ? CFG.rooms[slug].name : slug); };
  var multi = function () { return view === 'all'; };

  /* ---------- sign in ---------- */
  function login() {
    $('ttl').textContent = 'Tasting rooms'; $('out').hidden = true; document.title = 'Tiburón tastings';
    $('app').innerHTML = '<form class="login pin" id="pf"><h2 class="cap">Sign in</h2><p>Enter the 6-digit Tiburón tasting rooms PIN. This phone will stay signed in.</p>' +
      '<input id="pin" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="6" aria-label="PIN" required>' +
      '<button class="btn go" type="submit">Open bookings</button><p id="pe" class="err" hidden></p></form>';
    $('pin').focus();
    $('pf').onsubmit = function (e) {
      e.preventDefault(); var b = $('pf').querySelector('.btn'); b.disabled = true;
      api('room-login', { pin: $('pin').value }).then(function (j) {
        if (!j.ok) throw j.message || 'That PIN isn\'t right.';
        me = { room: 'all', key: j.key }; store.set(me); unlockSound(); start();
      }).catch(function (m) { b.disabled = false; $('pe').hidden = false; $('pe').textContent = typeof m === 'string' ? m : 'Could not connect. Check the internet and try again.'; $('pin').select(); });
    };
  }
  $('out').onclick = function () { if (confirm('Sign out of this phone? You\'ll need the PIN to get back in.')) { store.set(null); me = null; data = null; known = null; login(); } };

  /* ---------- the ring when a new booking arrives ---------- */
  var ctx = null;
  function unlockSound() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state !== 'running') ctx.resume().then(drawSound, drawSound); } catch (e) { ctx = null; } drawSound(); }
  function ring() {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    if (!ctx || ctx.state !== 'running') return;
    [0, 0.22, 0.44].forEach(function (t, i) { var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = i === 1 ? 1175 : 880; g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.18); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2); });
  }
  function drawSound() { var s = $('snd'); if (s) s.hidden = !!(ctx && ctx.state === 'running'); }

  /* ---------- the bookings screen ---------- */
  function start() {
    $('ttl').textContent = 'Tasting rooms'; $('out').hidden = false;
    $('app').innerHTML = '<p class="upd">Loading bookings…</p>';
    load();
  }
  function load() {
    var my = ++seq;
    return api('room-bookings?room=' + encodeURIComponent(me.room) + '&key=' + encodeURIComponent(me.key) + '&_=' + Date.now()).then(function (j) {
      if (my !== seq) return;
      if (j._status === 403) { store.set(null); me = null; login(); toast('Please sign in again'); return; }
      if (!j.ok) throw 0;
      today = j.today; data = j;
      var ids = pendingIds();
      if (known && ids.some(function (id) { return known.indexOf(id) < 0; })) { ring(); toast('New booking'); }
      known = ids;
      setTitle();
      if (!closing) draw();
    }).catch(function () {
      if (my !== seq) return;
      var e = $('neterr'); if (e) e.hidden = false; else if (!data) $('app').innerHTML = '<p class="err" id="neterr">Could not load bookings. Check the internet; this page will keep trying.</p>';
    });
  }
  function setTitle() { var n = known ? known.length : 0; document.title = (n ? '(' + n + ') New booking' + (n > 1 ? 's' : '') + ' · ' : '') + (view === 'all' ? 'Tiburón' : roomName(view)) + ' tastings'; }
  var shortDay = function (ymd) { return new Date(ymd + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); };
  var longDay = function (ymd) { return new Date(ymd + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }); };
  var addDays = function (ymd, n) { var d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  var dayWord = function (ymd) { return ymd === today ? 'Today' : ymd === addDays(today, 1) ? 'Tomorrow' : shortDay(ymd); };
  var gs = function (n) { return n + (n === 1 ? ' guest' : ' guests'); };
  var color = function (b) { return esc((CFG.rooms[b.room] || {}).color || '#76582a'); };
  var contact = function (b) { return '<a href="mailto:' + esc(b.email) + '">' + esc(b.email) + '</a>' + (b.phone ? '<br><a href="tel:' + esc(b.phone.replace(/[^0-9+]/g, '')) + '">' + esc(b.phone) + '</a> · <a href="https://wa.me/' + esc(b.phone.replace(/[^0-9]/g, '')) + '" target="_blank" rel="noopener">WhatsApp</a>' : ''); };
  var waited = function (b) { if (!b.created || !data.now) return ''; var h = (data.now - b.created) / 3600; return h >= 1 ? ' · waiting ' + Math.floor(h) + 'h' : ''; };
  var mailWarn = function (b) { return b.mailed === 'failed' ? '<p class="warn">The email to ' + esc(b.name) + ' didn\'t send. Please call or WhatsApp them.</p>' : ''; };

  function draw() {
    var bs = data.bookings.filter(inView), nw = bs.filter(function (b) { return b.status === 'pending'; });
    var newIn = function (slug) { return data.bookings.filter(function (b) { return b.status === 'pending' && (slug === 'all' || b.room === slug); }).length; };
    var chip = function (slug, label, c) { var n = newIn(slug); return '<button type="button" data-view="' + slug + '"' + (view === slug ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + (c ? ' style="--c:' + esc(c) + '"' : '') + '>' + (c ? '<i></i>' : '') + esc(label) + (n ? ' <b>' + n + '</b>' : '') + '</button>'; };
    var ok = bs.filter(function (b) { return b.status === 'confirmed'; });
    var tdy = ok.filter(function (b) { return b.date === today; });
    var soon = ok.filter(function (b) { return b.date > today && (showAll || b.date <= addDays(today, 14)); });
    var html = '<div class="flt" role="group" aria-label="Show bookings for">' + chip('all', 'All rooms') + Object.keys(CFG.rooms).map(function (s) { return chip(s, CFG.rooms[s].name, CFG.rooms[s].color); }).join('') + '</div>';
    html += '<div class="sound" id="snd"' + (ctx && ctx.state === 'running' ? ' hidden' : '') + '><span>Turn on sound so this phone rings when a booking comes in.</span><button type="button" id="sndb">Turn on sound</button></div>';

    html += '<h2 class="cap">New bookings' + (nw.length ? ' <b>' + nw.length + '</b>' : '') + '</h2>';
    html += nw.length ? nw.map(function (b) {
      return '<article class="new" data-id="' + b.id + '">' + (multi() ? '<span class="rm cap" style="--c:' + color(b) + '">' + esc(b.roomName) + '</span>' : '') +
        '<p class="when cap">' + esc(dayWord(b.date)) + (b.date === today || b.date === addDays(today, 1) ? ', ' + esc(shortDay(b.date)) : '') + esc(waited(b)) + '</p>' +
        '<div class="t">' + esc(b.timeText) + '</div><p class="who">' + esc(b.name) + '</p><p class="m">' + gs(b.guests) + ' · ' + esc(b.total) + ' at the room</p>' +
        '<div class="acts"><button class="btn go" data-do="confirmed">Accept</button><button class="btn" data-do="declined">Can\'t do it</button></div></article>';
    }).join('') : '<div class="list"><p class="none">Nothing new. New bookings show up here.</p></div>';

    var rows = function (list, withDay) {
      var out = '', last = '';
      list.forEach(function (b) {
        if (withDay && b.date !== last) { out += '<div class="day cap">' + esc(dayWord(b.date)) + '</div>'; last = b.date; }
        out += '<div class="row" data-id="' + b.id + '"><span class="t">' + esc(b.timeText) + '</span><span class="who">' + esc(b.name) + '</span><span class="g">' + gs(b.guests) + '</span>' +
          (multi() ? '<span class="rmn" style="--c:' + color(b) + '">' + esc(b.roomName) + '</span>' : '') + mailWarn(b) +
          '<details><summary>Contact &amp; options</summary>' + contact(b) + '<br>' + esc(b.total) + ' at the room<br><button type="button" class="x" data-do="declined">Cancel this booking</button></details></div>';
      });
      return out;
    };
    var closed = data.closed.filter(inView);
    var closedToday = closed.filter(function (c) { return c.date === today; });
    html += '<h2 class="cap">Today · ' + esc(longDay(today)) + '</h2><div class="list">' +
      (closedToday.length && !multi() ? '<p class="none"><b>Closed today' + (closedToday[0].reason ? ' (' + esc(closedToday[0].reason) + ')' : '') + '.</b> The website isn\'t taking bookings for today.</p>' : '') +
      (tdy.length ? rows(tdy, false) : '<p class="none">No tastings booked today.</p>') + '</div>';
    html += '<h2 class="cap">Coming up</h2><div class="list">' + (soon.length ? rows(soon, true) : '<p class="none">Nothing booked in the next two weeks.</p>') + '</div>';
    if (!showAll && ok.some(function (b) { return b.date > addDays(today, 14); })) html += '<button type="button" class="btn more" id="more">Show later bookings</button>';

    html += '<h2 class="cap">Closed days</h2><div class="list">' + (closed.length ? closed.map(function (c) {
      return '<div class="closed"><span><b>' + esc(longDay(c.date)) + '</b>' + (multi() ? ' · ' + esc(roomName(c.room)) : '') + (c.reason ? '<br>' + esc(c.reason) : '') + '</span><button type="button" data-open="' + esc(c.room) + '|' + esc(c.date) + '">Reopen</button></div>';
    }).join('') : '<p class="none">No closed days coming up. The website takes bookings during your regular hours.</p>') + '</div>';
    html += closing ? closeForm() : '<button type="button" class="btn more" id="closeb">Close a day</button>';
    html += '<p class="upd">Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · checks for new bookings every 30 seconds</p>';
    $('app').innerHTML = html;
    wire();
  }
  function closeForm() {
    return '<form class="closebox" id="cf"><h2 class="cap" style="margin-top:0">Close a day</h2>' +
      '<label for="cr">Room</label><select id="cr">' + Object.keys(CFG.rooms).map(function (s) { return '<option value="' + s + '"' + (s === view ? ' selected' : '') + '>' + esc(roomName(s)) + '</option>'; }).join('') + '</select>' +
      '<label for="cd">Day</label><input type="date" id="cd" min="' + today + '" max="' + esc(CFG.max) + '" value="' + today + '" required>' +
      '<label for="cw">Reason (optional, shown to guests)</label><input id="cw" maxlength="80" placeholder="Holiday, weather, private event">' +
      '<div class="acts" style="margin-top:0"><button class="btn go" type="submit">Close this day</button><button class="btn" type="button" id="cx">Never mind</button></div></form>';
  }
  function setStatus(id, status, btn) {
    if (btn) btn.disabled = true;
    return api('room-status', { room: me.room, key: me.key, id: id, status: status }).then(function (j) {
      if (!j.ok) throw 0;
      data.bookings = data.bookings.map(function (b) { return b.id === id ? j.booking : b; });
      known = pendingIds();
      setTitle();
      if (j.booking.mailed === 'failed') toast('Saved, but the email didn\'t send');
      else toast(status === 'confirmed' ? 'Accepted · guest emailed' : 'Done · guest emailed');
      draw();
    }).catch(function () { if (btn) btn.disabled = false; toast('Could not save. Try again.'); });
  }
  function wire() {
    var sb = $('sndb'); if (sb) sb.onclick = unlockSound;
    $('app').querySelectorAll('[data-view]').forEach(function (b) { b.onclick = function () { setView(b.dataset.view); }; });
    var m = $('more'); if (m) m.onclick = function () { showAll = true; draw(); };
    var cb = $('closeb'); if (cb) cb.onclick = function () { closing = true; draw(); $('cd').focus(); };
    var cx = $('cx'); if (cx) cx.onclick = function () { closing = false; draw(); };
    var cf = $('cf'); if (cf) cf.onsubmit = function (e) {
      e.preventDefault();
      var target = $('cr').value, date = $('cd').value;
      var has = data.bookings.filter(function (b) { return b.room === target && b.date === date && (b.status === 'pending' || b.status === 'confirmed'); });
      if (!confirm('Close ' + roomName(target) + ' on ' + longDay(date) + '? The website stops taking bookings for that day.' + (has.length ? '\n\n' + has.length + (has.length === 1 ? ' booking is' : ' bookings are') + ' already that day. They stay on the list; tap Cancel this booking on each one to email those guests.' : ''))) return;
      api('room-close', { room: me.room, key: me.key, target: target, date: date, reason: $('cw').value, closed: true }).then(function (j) {
        if (!j.ok) throw j.message; closing = false; toast('Day closed'); return load();
      }).catch(function (msg) { toast(typeof msg === 'string' ? msg : 'Could not save. Try again.'); });
    };
    $('app').querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () {
        var p = b.dataset.open.split('|');
        if (!confirm('Reopen ' + roomName(p[0]) + ' on ' + longDay(p[1]) + '? The website will take bookings for it again.')) return;
        api('room-close', { room: me.room, key: me.key, target: p[0], date: p[1], closed: false }).then(function (j) { if (!j.ok) throw 0; toast('Day reopened'); load(); }).catch(function () { toast('Could not save. Try again.'); });
      };
    });
    $('app').querySelectorAll('[data-do]').forEach(function (btn) {
      btn.onclick = function () {
        var el = btn.closest('[data-id]'), id = +el.dataset.id, b = data.bookings.filter(function (x) { return x.id === id; })[0], st = btn.dataset.do;
        if (st === 'declined' && !confirm((b.status === 'confirmed' ? 'Cancel ' : 'Turn down ') + b.name + '’s booking (' + dayWord(b.date) + ', ' + b.timeText + ')? They\'ll get an email asking them to pick another time.')) return;
        setStatus(id, st, btn);
      };
    });
  }

  if (me) start(); else login();
  setInterval(function () { if (me && !document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (me && !document.hidden) load(); });
  document.addEventListener('click', function once() { if (me && !ctx) unlockSound(); document.removeEventListener('click', once); });
})();
</script>
</body>
</html>
